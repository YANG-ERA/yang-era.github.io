{% assign figure = include.paper.figure %}
{% if figure %}
  {% assign figure_url = figure.path | relative_url %}
  <figure class="publication-figure" itemscope itemtype="https://schema.org/ImageObject">
    <meta itemprop="creditText" content="{{ figure.credit | escape }}">
    <link itemprop="license" href="{{ figure.license_url }}">
    <a itemprop="isBasedOn" href="{{ include.paper.paperurl }}" aria-label="View source: {{ figure.caption | escape }}">
      <img itemprop="contentUrl" src="{{ figure_url }}" alt="{{ figure.alt | escape }}" width="{{ figure.width }}" height="{{ figure.height }}" loading="lazy" decoding="async">
    </a>
  </figure>
{% endif %}
